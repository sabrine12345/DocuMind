server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: documind-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${DOCUMIND_MULTIPART_MAX_FILE_SIZE:25MB}
      max-request-size: ${DOCUMIND_MULTIPART_MAX_REQUEST_SIZE:120MB}
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

documind:
  cors:
    allowed-origins: ${DOCUMIND_CORS_ORIGINS:http://localhost:4200}
  storage:
    provider: ${DOCUMIND_STORAGE_PROVIDER:LOCAL}
    location: ${DOCUMIND_STORAGE_LOCATION:./data/storage}
    bucket: ${DOCUMIND_STORAGE_BUCKET:documind}
    endpoint: ${DOCUMIND_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${DOCUMIND_STORAGE_ACCESS_KEY:}
    secret-key: ${DOCUMIND_STORAGE_SECRET_KEY:}
    region: ${DOCUMIND_STORAGE_REGION:us-east-1}
  processing:
    mode: ${DOCUMIND_PROCESSING_MODE:local}
    max-attempts: ${DOCUMIND_PROCESSING_MAX_ATTEMPTS:3}
    sweep-enabled: ${DOCUMIND_PROCESSING_SWEEP_ENABLED:true}
    sweep-interval-ms: ${DOCUMIND_PROCESSING_SWEEP_INTERVAL_MS:5000}
    stale-after-seconds: ${DOCUMIND_PROCESSING_STALE_AFTER_SECONDS:30}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
      refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
      issuer: ${JWT_ISSUER:documind-api}
